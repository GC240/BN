<!--
  Corporate 360 · News & Market Intelligence
  Account: PETCO Singapore (PETRONAS Trading)
  ------------------------------------------------------------
  Drop-in panel for a 360 view. White background, four lenses as
  filter tabs: All / PETCO Singapore / Macro Economics /
  Competitor / Country & Market. All "Read original" links open
  in a new tab (target=_blank). URLs cleaned of the stray %22.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<div id="nf360" style="
  --ink:#1a2332; --ink-soft:#5b6577; --line:#e6e8ec; --bg:#ffffff;
  --bg-soft:#f7f8fa; --accent:#157a5b; --accent-d:#0f5c44;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:var(--bg); border:1px solid var(--line);
  border-radius:12px; overflow:hidden;">

  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);">
    <div style="display:flex;align-items:center;gap:10px;min-width:0;">
      <span style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:none;"></span>
      <span style="font-weight:700;font-size:15px;">News &amp; Market Intelligence</span>
      <span style="background:#e8f5ef;color:var(--accent-d);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;">PETCO Singapore</span>
    </div>
    <button id="nf-refresh" title="Refresh" style="width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;">
      <svg id="nf-spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>

  <!-- Filter tabs (the four lenses) -->
  <div id="nf-tabs" style="display:flex;gap:6px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg);">
    <button class="nf-tab" data-cat="all">All</button>
    <button class="nf-tab" data-cat="petco">PETCO Singapore</button>
    <button class="nf-tab" data-cat="macro">Macro Economics</button>
    <button class="nf-tab" data-cat="competitor">Competitor</button>
    <button class="nf-tab" data-cat="country">Country &amp; Market</button>
  </div>

  <!-- Meta bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 20px;background:var(--bg-soft);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);">
    <div style="display:flex;align-items:center;gap:6px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Last updated: 22 Jun 2026, 09:40 am SGT</span>
    </div>
    <div id="nf-count">— results</div>
  </div>

  <!-- Feed -->
  <div id="nf-list" style="max-height:680px;overflow:auto;"></div>
</div>

<style>
  @keyframes nfspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  #nf360 .nf-tab{border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;transition:.15s;}
  #nf360 .nf-tab:hover{border-color:#c9ced6;color:var(--ink);}
  #nf360 .nf-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  #nf360 .nf-item:last-child{border-bottom:none;}
  #nf360 .nf-item:hover{background:#fafbfc;}
  #nf360 .topic:hover{background:#e2e6ec;}
  #nf360 .view-more:hover{color:var(--accent-d);}
  #nf360 .read-original:hover{color:var(--ink);}
</style>

<script>
(function(){
  // category meta: label + chip colors
  const CAT = {
    petco:      {label:"PETCO Singapore", bg:"#e8f5ef", fg:"#0f5c44"},
    macro:      {label:"Macro Economics", bg:"#eaf1fb", fg:"#1f5bb5"},
    competitor: {label:"Competitor",      bg:"#fdeee6", fg:"#b5531f"},
    country:    {label:"Country & Market",fg:"#7a4fb5", bg:"#f1ecfb"}
  };

  const items = [
    // ---------------- PETCO SINGAPORE (company) ----------------
    { cat:"petco", icon:"🏛️",
      title:"PETRONAS to Assume Full Ownership of PRefChem",
      topics:["Downstream","Feedstock","M&A"],
      source:"PETRONAS", date:"25 May 2026",
      summary:"PETRONAS announced it will take full ownership of the Pengerang Refining and Petrochemical complex (PRefChem) as Aramco transfers its remaining stake. Consolidating the refinery and petrochemical base strengthens the integrated supply that feeds PETCO's crude and product trading across the East-of-Suez markets, including Singapore.",
      url:"https://www.petronas.com/" },

    { cat:"petco", icon:"🤝",
      title:"PETRONAS and ENEOS Xplora Strengthen Strategic Partnership for Energy Security",
      topics:["Partnership","Supply Security","LNG"],
      source:"PETRONAS", date:"30 Apr 2026",
      summary:"PETRONAS and Japan's ENEOS Xplora deepened a strategic partnership aimed at supporting long-term energy security, spanning upstream collaboration and cleaner-energy supply. For the trading arm (PETCO), tighter producer-offtaker ties help secure volumes and customer demand amid a volatile crude and LNG market.",
      url:"https://www.petronas.com/" },

    { cat:"petco", icon:"🌊",
      title:"PETRONAS and Regional Partners to Advance Offshore Oil Recovery",
      topics:["Upstream","Production","Volumes"],
      source:"PETRONAS", date:"4 Jun 2026",
      summary:"PETRONAS and regional partners agreed to advance enhanced offshore oil recovery, targeting incremental output from mature fields. Higher upstream availability supports the crude and refined-product volumes that PETCO markets and trades internationally.",
      url:"https://www.petronas.com/" },

    { cat:"petco", icon:"⛴️",
      title:"PETCO Drives LNG and Cleaner Bunker Fuels via the PETRONAS Marine Brand",
      topics:["LNG Bunkering","Trading Arm","Decarbonisation"],
      source:"PETRONAS — Marketing & Trading", date:"Ongoing",
      summary:"Through PETRONAS Trading Corporation (PETCO) and the PETRONAS Marine brand, the group markets and trades crude, petroleum products, LNG and gas, and supplies LNG as a cleaner bunkering alternative. Coverage spans East of Suez (Asia-Pacific, Far East), West of Suez, the Middle East and the Red Sea — positioning Singapore as a key trading and bunkering node.",
      url:"https://www.petronas.com/progressing-energy/marketing-trading-retail" },

    // ---------------- MACRO ECONOMICS (oil market / global) ----------------
    { cat:"macro", icon:"📉",
      title:"Brent Crude Falls Toward Four-Month Low as US-Iran Truce Signals Firm Up",
      topics:["Brent Crude","Geopolitics","Oil Market"],
      source:"Trading Economics", date:"18 Jun 2026",
      summary:"Brent fell to around $78 a barrel, its lowest since late February, on reports the US and Iran signed an interim agreement covering reopening of the Strait of Hormuz and removal of sanctions on Iranian exports. The IEA separately flagged a potential supply glut, projecting supply growth of 8m b/d by 2027 against demand growth of just 2m b/d.",
      url:"https://tradingeconomics.com/commodity/brent-crude-oil" },

    { cat:"macro", icon:"📊",
      title:"EIA: Brent to Average ~$105/bbl Through June–July on Hormuz Disruption",
      topics:["Forecast","EIA","Hormuz"],
      source:"U.S. Energy Information Administration", date:"9 Jun 2026",
      summary:"The EIA's June Short-Term Energy Outlook assumes the Strait of Hormuz stays largely closed into early summer, with flows resuming in Q3 2026 and normalising only in early 2027. Global oil inventories are estimated to be drawing by an average 6.3m b/d in Q2 2026, keeping prices elevated even as May eased about $10/bbl from April.",
      url:"https://www.eia.gov/outlooks/steo/report/global_oil.php" },

    { cat:"macro", icon:"⚖️",
      title:"JPMorgan Holds Bearish $60/bbl Brent Call Despite Iran Tensions",
      topics:["Forecast","Analysis","Supply-Demand"],
      source:"J.P. Morgan Global Research", date:"2026",
      summary:"J.P. Morgan maintains a 2026 Brent average near $60/bbl, arguing soft fundamentals will dominate even with rising US-Iran tensions. The bank expects military action to stay targeted and spare Iran's export infrastructure, and notes sanctions on Russian oil are redirecting barrels toward China and away from India.",
      url:"https://www.jpmorgan.com/insights/global-research/commodities/oil-prices" },

    { cat:"macro", icon:"🛢️",
      title:"US Extends Sanctions Waiver on Russian Oil Amid Hormuz Disruption",
      topics:["Sanctions","Russia","Policy"],
      source:"Al Jazeera", date:"19 May 2026",
      summary:"The US Treasury extended a waiver allowing countries to buy Russian oil and products already loaded on tankers at sea, with Secretary Scott Bessent citing the need to give vulnerable nations temporary access to crude stranded at sea amid the conflict's disruption of energy markets.",
      url:"https://www.aljazeera.com/news/2026/5/19/us-extends-sanctions-waiver-on-russian-oil-why-it-matters" },

    { cat:"macro", icon:"📋",
      title:"OFAC Alert Flags Sanctions Risk of Dealing with Teapot Oil Refineries",
      topics:["Sanctions","OFAC","Compliance"],
      source:"U.S. Department of the Treasury", date:"28 Apr 2026",
      summary:"OFAC issued a fresh alert on sanctions risk tied to independent Chinese 'teapot' refineries buying Iranian crude — part of a wider run of Iran-related licenses and guidance covering shadow-fleet vessels, shipping evasion, and Russian-origin crude transactions.",
      url:"https://ofac.treasury.gov/sanctions-programs-and-country-information/iran-sanctions" },

    { cat:"macro", icon:"🧭",
      title:"Sanctions Waivers on Russian and Iranian Oil Set to Expire: What Comes Next",
      topics:["Policy Analysis","Sanctions"],
      source:"Atlantic Council", date:"8 Apr 2026",
      summary:"General licenses that injected Russian and Iranian oil into markets during the Hormuz disruption are lapsing in stages. Intended to ease shortages in India and other Asian importers, their expiry creates a fresh policy fork for Washington as it balances price stability against enforcement.",
      url:"https://www.atlanticcouncil.org/dispatches/sanctions-waivers-on-russian-and-iranian-oil-are-set-to-expire/" },

    // ---------------- COMPETITOR ----------------
    { cat:"competitor", icon:"🚢",
      title:"Molgas Conducts Its First LNG Bunkering at Italy's Port of Palermo",
      topics:["LNG Bunkering","Europe","Operations"],
      source:"Ship & Bunker", date:"16 Jun 2026",
      summary:"Molgas Energy Group ran its first LNG bunkering at Palermo, supplying a ferry via three tank trucks over a 10-12 hour operation coordinated across teams in Italy, Spain, the Netherlands and Greece — as LNG bunker demand rises with more dual-fuel ships joining the fleet.",
      url:"https://shipandbunker.com/news/emea/746954-molgas-conducts-its-first-lng-bunkering-at-italys-port-of-palermo" },

    { cat:"competitor", icon:"⛽",
      title:"MSC USA Completes First-Ever LNG Bunkering Operation in the United States",
      topics:["LNG Bunkering","USA","Milestone"],
      source:"MSC", date:"Jun 2026",
      summary:"MSC USA completed MSC's first LNG bunkering in the US: the MSC Maria Christina took on 6,800 m³ of LNG from bunkering vessel Seaspan Baker at the Long Beach Harbor inner anchorage, an area designated to ease congestion outside the breakwater.",
      url:"https://www.msc.com/en/newsroom/news/local-news/united-states/2026/june/msc-usa-completes-first-ever-lng-bunkering-operation" },

    { cat:"competitor", icon:"🤝",
      title:"NYK, Golden Island and Yara Clean Ammonia Partner on Singapore Ammonia Bunkering",
      topics:["Ammonia","Singapore","Partnership"],
      source:"NYK Line", date:"20 Apr 2026",
      summary:"NYK, Golden Island and Yara Clean Ammonia formed a partnership to drive sales and marketing of ammonia as a marine fuel in Singapore, pairing Golden Island's four decades of local bunkering with a push to build a low-carbon ammonia supply chain — a direct alternative-fuel play in PETCO's home port.",
      url:"https://www.nyk.com/english/news/2026/20260420_01.html" },

    { cat:"competitor", icon:"🌍",
      title:"Galveston's Pelican Island Could Provide Cruise LNG Bunkering Site",
      topics:["LNG Bunkering","USA","Infrastructure"],
      source:"Seatrade Cruise News", date:"17 Jun 2026",
      summary:"The Port of Galveston proposed a multi-use berth on Pelican Island supporting a $1bn shipbuilding project alongside ro-ro cargo and LNG marine bunkering, aiming to develop 357 acres of undeveloped waterfront — signalling expanding LNG bunker infrastructure competition.",
      url:"https://www.seatrade-cruise.com/ports-destinations/galveston-s-pelican-island-could-provide-cruise-lng-bunkering-site" },

    // ---------------- COUNTRY & INTERNAL MARKET (Singapore) ----------------
    { cat:"country", icon:"🏦",
      title:"MAS Tightens S$NEER as Hormuz Energy Shock Lifts Inflation Outlook",
      topics:["MAS","Monetary Policy","Inflation"],
      source:"Monetary Authority of Singapore", date:"14 Apr 2026",
      summary:"MAS slightly increased the slope of the S$NEER policy band — its first tightening in about three years — projecting core and headline inflation at 1.5-2.5% for 2026 as the Middle East conflict raises imported energy costs. The review flags drags on energy-dependent sectors such as petrochemicals and transport.",
      url:"https://www.mas.gov.sg/news/monetary-policy-statements/2026/mas-monetary-policy-statement-14apr26" },

    { cat:"country", icon:"📈",
      title:"Singapore Q1 GDP Revised to 6%; April Inflation Eases to 1.8%",
      topics:["GDP","Inflation","Outlook"],
      source:"CNBC", date:"25 May 2026",
      summary:"Singapore revised Q1 2026 GDP growth up to 6% from a 4.6% advance estimate, while April headline inflation came in softer at 1.8% (core 1.4%). MTI kept full-year growth at 2-4% amid Strait of Hormuz energy disruption, with imported cost pressures expected to broaden in coming months.",
      url:"https://www.cnbc.com/2026/05/25/singapore-inflation-gdp-iran-war-energy.html" },

    { cat:"country", icon:"📚",
      title:"MAS Macroeconomic Review: Energy Supply Shock to Weigh on Petrochemicals",
      topics:["Macro Review","Petrochemicals","Energy Costs"],
      source:"Monetary Authority of Singapore", date:"Apr 2026",
      summary:"The April Macroeconomic Review expects accumulated energy shortfalls and higher input costs to drag value-added in energy-dependent industries like petrochemicals and transport, even as AI-related capex sustains the tech cluster. Singapore is also seeing higher vessel traffic as a hub for re-routed ships.",
      url:"https://www.mas.gov.sg/publications/macroeconomic-review/2026/volume-xxv-issue-2-apr-2026" },

    { cat:"country", icon:"⚓",
      title:"Singapore Bunkering Sector Copes with Mid-Term Supply Uncertainty",
      topics:["Bunkering","Marine Fuel","Market"],
      source:"Manifold Times", date:"12 May 2026",
      summary:"A survey of Singapore marine fuel traders, suppliers and shipowners found most uncertain about mid-term fuel availability and pricing as the 2026 Iran conflict disrupts oil supply. Many pointed to alternative bunker fuels as a way to diversify away from fossil fuels whose pricing is now heavily geopolitics-driven.",
      url:"https://www.manifoldtimes.com/news/in-depth-singapore-bunkering-sector-clarifies-uncertainty-copes-with-supply-disruptions/" },

    { cat:"country", icon:"💸",
      title:"Trade Finance Fraud Keeps Banks Wary of Commodity and Bunker Lending",
      topics:["Trade Finance","Risk","Banking"],
      source:"Trade Finance Global", date:"2026",
      summary:"A recurring wave of commodity trade finance fraud — including the collapse of Hin Leong and other Singapore-linked traders — has pushed several banks to scale back sector lending. The piece weighs whether trade digitization can give lenders enough verifiable, fraud-resistant data to re-enter the market.",
      url:"https://www.tradefinanceglobal.com/posts/is-trade-digitization-the-answer-to-commodity-trade-finance-fraud/" }
  ];

  const list  = document.getElementById('nf-list');
  const tabs  = document.getElementById('nf-tabs');
  const count = document.getElementById('nf-count');
  let active  = 'all';

  function render(){
    const data = active === 'all' ? items : items.filter(i => i.cat === active);
    count.textContent = data.length + (data.length === 1 ? ' result' : ' results');
    list.innerHTML = '';

    if(!data.length){
      list.innerHTML = '<div style="padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:13px;">No items in this lens yet.</div>';
      return;
    }

    data.forEach((item, idx) => {
      const c = CAT[item.cat];
      const topics = item.topics.map(t =>
        `<span class="topic" style="display:inline-block;background:#eef1f5;color:#445063;font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px;margin:0 5px 5px 0;transition:.15s;">${t}</span>`
      ).join('');

      const row = document.createElement('div');
      row.className = 'nf-item';
      row.style.cssText = 'display:flex;gap:15px;padding:18px 20px;border-bottom:1px solid var(--line);transition:background .15s;';
      row.innerHTML = `
        <div style="flex:none;width:48px;height:48px;border-radius:9px;background:var(--bg-soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;">${item.icon}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
            <span style="background:${c.bg};color:${c.fg};font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:3px 9px;border-radius:6px;">${c.label}</span>
          </div>
          <div style="font-weight:600;font-size:14.5px;line-height:1.35;margin-bottom:7px;">${item.title}</div>
          <div style="margin-bottom:7px;">${topics}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">
            <span style="font-weight:600;color:var(--ink);">${item.source}</span> &nbsp;|&nbsp; ${item.date}
          </div>
          <div class="summary-text" style="font-size:13px;color:#3a4252;line-height:1.55;margin-bottom:10px;max-height:3.1em;overflow:hidden;transition:max-height .25s ease;">${item.summary}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <a href="javascript:void(0)" class="view-more" style="font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:1px;transition:color .15s;">View More</a>
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="read-original" style="font-size:12.5px;color:var(--ink-soft);text-decoration:none;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:color .15s;">
              Read original
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
          </div>
        </div>`;
      list.appendChild(row);
    });
  }

  // expand / collapse summaries
  list.addEventListener('click', e => {
    const btn = e.target.closest('.view-more');
    if(!btn) return;
    const s = btn.closest('.nf-item').querySelector('.summary-text');
    const open = s.style.maxHeight === 'none';
    s.style.maxHeight = open ? '3.1em' : 'none';
    btn.textContent = open ? 'View More' : 'View Less';
  });

  // tab filtering
  tabs.addEventListener('click', e => {
    const b = e.target.closest('.nf-tab');
    if(!b) return;
    active = b.dataset.cat;
    [...tabs.children].forEach(x => x.classList.toggle('active', x === b));
    render();
  });

  // refresh spin (visual)
  document.getElementById('nf-refresh').addEventListener('click', () => {
    const s = document.getElementById('nf-spin');
    s.style.animation = 'nfspin .6s linear';
    s.addEventListener('animationend', () => s.style.animation = '', {once:true});
    render();
  });

  // init
  tabs.querySelector('[data-cat="all"]').classList.add('active');
  render();
})();
</script>
