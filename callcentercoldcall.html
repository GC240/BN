<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outbound Campaign · New Credit Card — Agent Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#efefef;--card:#ffffff;--soft:#f6f7f9;--line:#e4e6ea;--line2:#f0f1f3;
  --ink:#1b1f29;--muted:#6b7280;--faint:#9ca3af;
  --bar:#000000;--on-bar:#ffffff;--pill:#000000;--on-pill:#ffffff;
  --teal:#3fbcd4;--pink:#e94b7a;--yellow:#fbbf24;--blue:#0a5fb4;--lime:#c8dc2c;--green:#1f9d4c;--red:#d93a3a;
  --teal-s:#e3f6fa;--pink-s:#fde8ef;--yellow-s:#fff5da;--blue-s:#e5eff9;--green-s:#e6f5ec;--red-s:#fdeaea;
  color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0e1116;--card:#171b22;--soft:#1d222b;--line:#2b313c;--line2:#222833;--ink:#e8ebf0;--muted:#a1a9b6;--faint:#7a8494;
  --pill:#e8ebf0;--on-pill:#0e1116;--teal-s:#13303a;--pink-s:#3a1823;--yellow-s:#352a10;--blue-s:#14263b;--green-s:#13281c;--red-s:#331717;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0e1116;--card:#171b22;--soft:#1d222b;--line:#2b313c;--line2:#222833;--ink:#e8ebf0;--muted:#a1a9b6;--faint:#7a8494;
  --pill:#e8ebf0;--on-pill:#0e1116;--teal-s:#13303a;--pink-s:#3a1823;--yellow-s:#352a10;--blue-s:#14263b;--green-s:#13281c;--red-s:#331717;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--page);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* shell */
.top{position:sticky;top:0;z-index:20;height:56px;background:var(--bar);color:var(--on-bar);display:flex;align-items:center;gap:16px;padding:0 18px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.logo{font-weight:800;line-height:.9;font-size:17px;letter-spacing:.2px}
.top .sp{flex:1}
.cti{display:flex;align-items:center;gap:8px;color:#fff;background:#1d2129;border-radius:20px;padding:5px 6px 5px 12px;font-size:12px}
.cti .st{display:inline-flex;align-items:center;gap:6px}
.cti .led{width:8px;height:8px;border-radius:50%;background:#4ade80}
.cti select{background:#2a2f39;border:0;border-radius:14px;padding:3px 8px;color:#fff;font-size:12px}
.av{width:34px;height:34px;border-radius:50%;background:#2a2f39;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;flex-shrink:0}
.shell{display:flex;min-height:100%;padding-top:env(safe-area-inset-top,0px)}
.rail{width:52px;background:var(--bar);flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:16px}
.rail span{width:18px;height:18px;border:1.6px solid #9aa0aa;border-radius:4px;display:block}
.rail span:nth-child(3n){border-radius:50%}
.main{flex:1;min-width:0;background:var(--page)}
.head{background:var(--card);padding:10px 16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head .ht{flex:1;min-width:240px}
.head .camp{font-size:12px;font-weight:400;color:var(--muted)}
.body{padding:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;font-size:12.5px}
.tab.on{background:var(--pill);color:var(--on-pill);border-color:var(--pill);font-weight:500}
.tab .ct{background:var(--pink);color:#fff;border-radius:10px;font-size:10.5px;padding:0 6px;margin-left:6px}

/* cards */
.card{background:var(--card);border-radius:10px;padding:14px}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-size:11.5px;font-weight:400;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:17px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:15px}
.desk{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:12px;align-items:stretch;height:max(640px,calc(100vh - 190px))}
.col{min-height:0;overflow-y:auto;scrollbar-width:thin}
.col-q{display:flex;flex-direction:column;overflow:hidden}
.col-r{display:flex;flex-direction:column;gap:12px}
.col-r>.card:last-child{flex:1}
.col-c{display:flex;flex-direction:column;gap:12px}
.col-c>.card:last-child{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mt{margin-top:12px}
.mut{color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.t-teal{background:var(--teal-s);color:#137a8f}.t-pink{background:var(--pink-s);color:#b8285a}.t-yel{background:var(--yellow-s);color:#9a6b00}.t-blue{background:var(--blue-s);color:var(--blue)}.t-green{background:var(--green-s);color:var(--green)}.t-red{background:var(--red-s);color:var(--red)}.t-n{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){.t-teal{color:#7fd8ea}.t-pink{color:#f59ab8}.t-yel{color:#f8cf63}}

/* queue */
.qlist{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px}
.qfilter{flex-shrink:0;display:flex;gap:6px;margin-bottom:10px}
.qfilter input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--card);min-width:0}
.q{border:1px solid var(--line2);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;background:var(--card);text-align:left;width:100%;display:block}
.q:hover{border-color:var(--teal)}
.q.on{border-color:var(--blue);background:var(--blue-s)}
.q .r1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.q .nm{font-weight:600}
.q .r2{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
.prop{height:5px;border-radius:3px;background:var(--line2);margin-top:7px;overflow:hidden}
.prop i{display:block;height:100%;background:var(--teal)}
.q.done{opacity:.55}

/* call bar */
.callbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.callbar .who{flex:1;min-width:180px}
.callbar .who b{font-size:14.5px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;min-width:56px}
.cbtn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:500}
.cbtn.dial{background:var(--green);color:#fff;border-color:var(--green)}
.cbtn.end{background:var(--red);color:#fff;border-color:var(--red)}
.cbtn.on{background:var(--yellow);border-color:var(--yellow);color:#1b1f29}
.cbtn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.live i{background:var(--green);animation:pulse 1.2s infinite}
.status.ring i{background:var(--yellow)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.status.live i{animation:none}}

/* brief */
.brief{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px}
.brief .k{font-size:11px;color:var(--muted)}
.brief .v{font-weight:500;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:7px 10px;border-radius:6px;margin-top:10px}
.hl{background:var(--teal-s);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12.5px}
.hl b{color:var(--blue)}

/* script */
.steps{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto}
.stp{flex:1 0 auto;border:0;background:var(--soft);border-radius:6px;padding:6px 10px;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.stp.on{background:var(--blue);color:#fff}
.stp.ok{background:var(--green-s);color:var(--green)}
.say{border-left:3px solid var(--teal);background:var(--soft);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;margin-bottom:8px}
.say .lbl{font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.say.ar{direction:rtl;text-align:right;border-left:0;border-right:3px solid var(--yellow);border-radius:8px 0 0 8px}
.tip{font-size:12px;color:var(--muted);margin-bottom:8px}
.ben{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.ben div{border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12px}
.ben b{display:block;font-size:13px;margin-bottom:2px}
.obj{border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.obj summary{padding:8px 10px;cursor:pointer;font-weight:500;font-size:12.5px;display:flex;gap:8px;align-items:center}
.obj summary input{accent-color:var(--pink)}
.obj p{padding:0 12px 10px 32px;font-size:12.5px}
.snav{display:flex;justify-content:space-between;margin-top:10px}

/* script timeline */
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.sh b{font-size:14px}
.sh .mut{font-size:12px}
.sstats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--blue-s);border-radius:8px;padding:10px 6px;margin-bottom:6px;text-align:center}
.sstats .n{width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;margin:0 auto 4px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.sstats .l{font-size:10px;color:var(--muted);letter-spacing:.3px}
.tl{position:relative}
.tli{position:relative;padding-left:48px}
.tli::before{content:"";position:absolute;left:17px;top:0;bottom:0;border-left:1.5px dashed var(--line)}
.tli:first-child::before{top:22px}.tli:last-child::before{bottom:calc(100% - 22px)}
.tic{position:absolute;left:0;top:6px;width:36px;height:36px;border-radius:50%;background:var(--pink-s);display:grid;place-items:center;color:var(--ink);z-index:1}
.tli.ok .tic{background:var(--green-s);color:var(--green)}
.tli.cur .tic{background:var(--blue);color:#fff}
.tlh{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:8px 0 10px}
.tlh .tt{font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center}
.tlh .td{font-size:11.5px;color:var(--muted)}
.tlb{padding:10px 0 12px;border-bottom:1px solid var(--line2)}
.kq{font-weight:600;font-size:12.5px;margin:8px 0 5px}
.lf{font-size:11.5px;color:var(--muted);margin:6px 0}
.lf b{color:var(--ink)}
.avoid{font-size:11.5px;color:var(--red);margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 11px;font-size:12px}
.chip.on{background:var(--pill);color:var(--on-pill);border-color:var(--pill)}
.chip.g{border-color:var(--green);color:var(--green)}.chip.r{border-color:var(--pink);color:#b8285a}
.vchk{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.vchk input{accent-color:var(--green);width:15px;height:15px}

/* forms */
.f{display:grid;gap:10px}
.f label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--card);min-height:34px}
textarea.inp{resize:vertical;min-height:70px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 11px;font-size:12px}
.seg button.on{background:var(--pill);color:var(--on-pill);border-color:var(--pill)}
.b{border-radius:20px;padding:7px 18px;font-weight:500;border:1px solid var(--line);background:var(--card)}
.b-lime{background:var(--lime);border-color:var(--lime);color:#1b1f29}
.b-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.b:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;border-radius:6px;padding:7px 10px}
.n-y{background:var(--yellow-s);color:#8a5f00}.n-g{background:var(--green-s);color:var(--green)}.n-r{background:var(--red-s);color:var(--red)}.n-b{background:var(--blue-s);color:var(--blue)}
@media (prefers-color-scheme:dark){.n-y{color:#f8cf63}}

/* ai */
.ai{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
.ai h4{font-size:12px;font-weight:600;margin:8px 0 3px}
.ai h4:first-child{margin-top:0}
.ai ul{padding-left:16px}
.sent{display:flex;gap:4px;margin-top:4px}
.sent i{flex:1;height:6px;border-radius:3px;background:var(--line2)}

/* charts */
.chart svg{width:100%;height:auto;max-height:230px;display:block;margin:0 auto}
.axis{font-size:10px;fill:var(--muted)}
.lg{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.donut{width:150px;height:150px;border-radius:50%;margin:6px auto;position:relative}
.donut::after{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--card)}
.donut b{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:16px}
.lb{display:grid;grid-template-columns:20px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.lb.me{background:var(--blue-s);border-radius:6px;padding:6px;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
th{text-align:left;font-weight:600;padding:8px;background:var(--yellow-s);white-space:nowrap}
td{padding:8px;border-top:1px solid var(--line2)}
.funnel div{height:30px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:#fff;border-radius:3px}
.foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);padding:10px 14px;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2129;color:#fff;padding:9px 16px;border-radius:6px;font-size:12.5px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:12.5px}

@media (max-width:1180px){.desk{grid-template-columns:280px minmax(0,1fr);height:auto}.col{overflow:visible}.col-q{max-height:80vh}.col-q .qlist{max-height:none}.desk>.col-r{grid-column:1/-1}.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.rail{display:none}.desk,.grid2,.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.brief{grid-template-columns:repeat(2,1fr)}.ben{grid-template-columns:1fr}.cti select{display:none}.main,.head{border-radius:0}}
</style>
</head>

function markStep(i){
  const sc=S.sc;sc.done.add(i);sc.times[i]=nowT();
  let n=i+1;while(n<SSTEPS.length&&sc.done.has(n))n++;

  if(sc.open===-1)toast('Script complete. Save the outcome.');
}
function branch(k){
  const sc=S.sc;
  if(k==='busy'){sc.done.add(0);sc.times[0]=nowT();setD('out','Call back');sc.open=6;toast('Callback set for the customer’s best time');}
  else if(k==='no'){setD('out','Not interested');sc.open=6;toast('Close politely and end the call');}
  else if(k==='fail'){toast('Identity not verified: do not discuss the offer. End politely.');setD('out','Call back');sc.open=-1;}
  else if(k==='apply'){sc.done.add(5);sc.times[5]=nowT();setD('out','Sale – application');sc.open=6;}
  else if(k==='details'){sc.done.add(5);sc.times[5]=nowT();S.disp.next='Send product details';setD('out','Interested');sc.open=6;}
  else if(k==='later'){sc.done.add(5);sc.times[5]=nowT();setD('out','Call back');sc.open=6;}
  renderDesk();
}
function rightHTML(){
  const c=cust(), D=S.disp;
  const outs=['Sale – application','Interested','Call back','Not interested','No answer','Wrong number'];
  const modes=['Call','SMS','WhatsApp','Email','Branch visit'];
  const needFU=['Interested','Call back'].includes(D.out);
  const canSave=c&&D.out&&!c.dnc;
  return `<div class="card"><h3>Call outcome</h3>
    ${!c?'<p class="mut" style="font-size:12.5px">Select a customer to record the outcome.</p>':`
    <div class="f">
      <div><label>Disposition *</label><div class="seg">${outs.map(o=>`<button class="${D.out===o?'on':''}" onclick="setD('out','${o}')">${o}</button>`).join('')}</div></div>
      <div><label>Preferred mode of communication</label><div class="seg">${modes.map(o=>`<button class="${(D.mode||c.pref)===o?'on':''}" onclick="setD('mode','${o}')">${o}</button>`).join('')}</div></div>
      <div><label>Agreed next step</label><select class="inp" onchange="S.disp.next=this.value">${['','Send product details','Call back to complete application','Book branch appointment','Collect salary certificate','Courier card application'].map(o=>`<option ${D.next===o?'selected':''} value="${o}">${o||'Select…'}</option>`).join('')}</select></div>
      ${needFU?`<div class="grid2"><div><label>Follow-up date (auto)</label><input type="date" class="inp" value="${D.date}" min="2026-11-05" onchange="setD('date',this.value)"></div>
        <div><label>Time</label><select class="inp" onchange="S.disp.time=this.value">${['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'].map(t=>`<option ${D.time===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
        ${D.date&&[5,6].includes(new Date(D.date+'T00:00:00Z').getUTCDay())?'<div class="note n-y">Friday/Saturday is outside the calling window. Pick Sunday to Thursday.</div>':''}
        <div class="note n-b">Auto-scheduled for the customer’s best time (${c.best}), next working day.</div>`:''}
      <div><label>Call notes</label><textarea class="inp" placeholder="What did the customer say?" oninput="S.disp.notes=this.value">${esc(D.notes)}</textarea></div>
      ${D.out==='Sale – application'&&!D.consent?'<div class="note n-y">Read the compliance statement and capture consent (script step 6) before saving a sale.</div>':''}
      <div class="row"><button class="b b-lime" ${canSave?'':'disabled'} onclick="saveCall()">Save outcome</button><button class="b" ${c&&!c.dnc?'':'disabled'} onclick="genAI()">Generate AI insight</button></div>
    </div>`}
  </div>
  <div class="card"><h3>AI conversation insight <small>${S.ai?'from call notes & transcript':''}</small></h3>${aiHTML()}</div>`;
}
function aiHTML(){
  const a=S.ai;
  if(!a) return '<p class="mut" style="font-size:12.5px">After the call, generate an insight from the notes, objections ticked and call duration.</p>';
  const sc={Positive:['var(--green)',5],Neutral:['var(--yellow)',3],Negative:['var(--red)',1]}[a.sent];
  return `<div class="ai">
    <h4>Summary</h4><p>${esc(a.sum)}</p>
    <h4>Sentiment · ${a.sent}</h4><div class="sent">${[1,2,3,4,5].map(i=>`<i style="${i<=sc[1]?'background:'+sc[0]:''}"></i>`).join('')}</div>
    <h4>Buying signals</h4><ul>${a.sig.map(s=>`<li>${esc(s)}</li>`).join('')||'<li>None detected</li>'}</ul>
    <h4>Objections</h4><ul>${a.obj.map(s=>`<li>${esc(s)}</li>`).join('')||'<li>None raised</li>'}</ul>
    <h4>Next best action</h4><p>${esc(a.nba)}</p>
    <h4>Updated propensity</h4><p>${a.p0}% → <b>${a.p1}%</b></p>
    <p class="mut" style="font-size:11px;margin-top:8px">AI-generated. Check before acting.</p></div>`;
}

/* ============ CALL ACTIONS ============ */
function pick(id){
  S.sel=id;S.sc=freshSc();S.sc.started=nowT();S.sc.startedMs=Date.now();S.objs=new Set();S.ai=null;
  const c=cust();S.disp={out:'',mode:c.pref,next:'',date:'',time:c.best.split('–')[0]||'10:00',notes:'',consent:false};
  renderDesk();
}
function togObj(k,on){on?S.objs.add(k):S.objs.delete(k)}
function setD(k,v){
  S.disp[k]=v;
  if(k==='out'&&['Interested','Call back'].includes(v)&&!S.disp.date){S.disp.date=nextWorkDay(1);S.disp.next=S.disp.next||(v==='Interested'?'Call back to complete application':'Send product details')}
  renderDesk();
}
function saveCall(){
  const c=cust(),D=S.disp;
  if(S.done[c.id]){toast('Outcome already saved for this customer.');return}
  if(D.out==='Sale – application'&&!D.consent){toast('Capture consent before saving a sale.');return}
  if(['Interested','Call back'].includes(D.out)){
    if(!D.date){toast('Pick a follow-up date.');return}
    const w=new Date(D.date+'T00:00:00Z').getUTCDay();if(w===5||w===6){toast('Follow-up must be Sunday to Thursday.');return}
    S.fu.push({c,date:D.date,time:D.time,mode:D.mode||c.pref,next:D.next||'Follow up',out:D.out});
  }
  const hIdx=4;S.lastDur=Math.floor((Date.now()-(S.sc.startedMs||Date.now()))/1000);S.k.dial++;
  if(!['No answer','Wrong number'].includes(D.out)){S.k.conn++;S.k.talk+=Math.max(S.lastDur,60)}
  if(D.out==='No answer'||D.out==='Wrong number'){S.hourly[hIdx][1]++}else{S.hourly[hIdx][0]++}
  if(D.out==='Sale – application'){S.k.sales++;S.k.int++;S.hourly[hIdx][2]++}
  if(D.out==='Interested')S.k.int++;
  S.outcomes[D.out==='Wrong number'?'No answer':D.out]=(S.outcomes[D.out==='Wrong number'?'No answer':D.out]||0)+1;
  TEAM[1][1]=S.k.sales+S.k.int;
  S.done[c.id]=D.out;
  if(!S.ai&&D.out!=='No answer'&&D.out!=='Wrong number')genAI(true);
  toast(`Outcome saved${S.fu.length&&['Interested','Call back'].includes(D.out)?` · follow-up ${dmy(D.date)} ${D.time} via ${D.mode||c.pref}`:''}`);
  kpis();renderDesk();renderOvr();renderFU();
}
function genAI(silent){
  const c=cust(),D=S.disp,n=(D.notes||'').toLowerCase();
  const out=D.out||'Undecided';
  const pos=['Sale – application','Interested'].includes(out)||/interest|yes|good|like|send/.test(n);
  const neg=out==='Not interested'||/no |not interested|angry|stop|complain/.test(n);
  const sent=neg?'Negative':pos?'Positive':'Neutral';
  const sig=[];
  if(/cashback|grocer|fuel/.test(n)||S.sc.done.has(3))sig.push('Engaged with the cashback-on-groceries pitch');
  if(/limit|how much/.test(n))sig.push('Asked about the credit limit');
  if(/when|deliver|how long/.test(n))sig.push('Asked about timelines, a sign of intent');
  if(out==='Interested'||out==='Sale – application')sig.push('Agreed to a next step');
  const obj=[...S.objs].map(k=>OBJ.find(o=>o[0]===k)[1]);
  const dur=mmss(S.lastDur||Math.floor((Date.now()-(S.sc.startedMs||Date.now()))/1000));
  const sum=`${dur} call with ${c.name} (${c.lang}). Pitched ${CARD.name} with a pre-approved limit of JOD ${c.limit.toLocaleString()} and an estimated JOD ${cashback(c).y.toFixed(0)} a year in cashback. Outcome: ${out}.${obj.length?' Raised: '+obj.join(', ').toLowerCase()+'.':''}${D.notes?' Agent note: “'+D.notes.slice(0,140)+'”':''}`;
  let nba='Close the record; re-target in the next campaign wave after 90 days.';
  if(out==='Sale – application')nba=c.seg==='Self-employed'?'Request income proof by '+(D.mode||c.pref)+' today; application stays pending until received.':'Send application confirmation and card delivery timeline by '+(D.mode||c.pref)+'.';
  else if(out==='Interested'||out==='Call back')nba=`Call back on ${dmy(D.date)} at ${D.time}${S.objs.has('fee')?', open with the fee-waiver threshold':''}${S.objs.has('interest')?', offer auto-pay from payroll':''}. Send the product sheet by ${D.mode||c.pref} first.`;
  else if(out==='Not interested'&&S.objs.has('have'))nba='Suppress from this campaign; flag for balance-transfer offer if launched.';
  const delta=out==='Sale – application'?14:out==='Interested'?8:out==='Call back'?2:out==='Not interested'?-30:-5;
  S.ai={sum,sent,sig,obj,nba,p0:c.prop,p1:Math.max(1,Math.min(99,c.prop+delta))};
  if(!silent){renderDesk();toast('AI insight generated')}
}

/* ============ OVERVIEW ============ */
function renderOvr(){
  const H=S.hourly,max=Math.max(...H.map(h=>h[0]+h[1]))+2;
  const W=560,Ht=200,bw=60,gap=(W-40-bw*5)/5;
  const bars=H.map((h,i)=>{const x=40+gap/2+i*(bw+gap);let y=Ht-20;const seg=[[h[1],'var(--yellow)'],[h[0]-h[2],'var(--teal)'],[h[2],'var(--pink)']];
    return seg.map(s=>{const hh=s[0]/max*(Ht-40);y-=hh;return `<rect x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${s[1]}"/>`}).join('')+`<text class="axis" x="${x+bw/2}" y="${Ht-5}" text-anchor="middle">${HOURS[i]}</text>`}).join('');
  const grid=[0,.25,.5,.75,1].map(f=>{const y=Ht-20-f*(Ht-40);return `<line x1="40" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text class="axis" x="32" y="${y+3}" text-anchor="end">${Math.round(f*max)}</text>`}).join('');
  const O=S.outcomes,tot=Object.values(O).reduce((a,b)=>a+b,0),cols=['var(--teal)','var(--blue)','var(--yellow)','var(--pink)','#c9ccd2'];
  let acc=0;const cg=Object.entries(O).map(([k,v],i)=>{const a=acc;acc+=v/tot*360;return `${cols[i]} ${a}deg ${acc}deg`}).join(',');
  const conv=Math.round(S.k.sales/Math.max(1,S.k.conn)*100);
  const ang=-90+Math.min(S.k.sales/6,1)*180;
  const days=['Sun','Mon','Tue','Wed','Thu','Sun','Mon','Tue','Wed','Thu'],wk=[2,4,3,5,6,4,7,5,8,S.k.sales+S.k.int];
  const pts=wk.map((v,i)=>[40+i*56,170-v*14]);const path=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const T=[...TEAM].sort((a,b)=>b[1]-a[1]);
  $('v-ovr').innerHTML=`<div class="grid2">
    <div class="card chart"><h3>Calls by time slot <small>today</small></h3><svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Calls by time slot">${grid}${bars}</svg>
      <div class="lg"><span><i style="background:var(--teal)"></i>Connected</span><span><i style="background:var(--pink)"></i>Converted</span><span><i style="background:var(--yellow)"></i>No answer</span></div></div>
    <div class="card chart"><h3>Daily application target <small>${S.k.sales} of 6</small></h3>
      <svg viewBox="0 0 300 170" role="img" aria-label="Target gauge"><path d="M40 150 A110 110 0 0 1 260 150" fill="none" stroke="var(--line2)" stroke-width="26"/>
      <path d="M40 150 A110 110 0 0 1 113 46" fill="none" stroke="var(--pink)" stroke-width="26"/><path d="M113 46 A110 110 0 0 1 220 72" fill="none" stroke="var(--yellow)" stroke-width="26"/><path d="M220 72 A110 110 0 0 1 260 150" fill="none" stroke="var(--teal)" stroke-width="26"/>
      <line x1="150" y1="150" x2="${150+90*Math.cos((ang-90)*Math.PI/180)}" y2="${150+90*Math.sin((ang-90)*Math.PI/180)}" stroke="#137a8f" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="150" r="7" fill="#137a8f"/>
      <text x="150" y="128" text-anchor="middle" font-size="13" fill="var(--yellow)">Conversion ${conv}%</text></svg>
      <div class="lg"><span>Behind</span><span>On track</span><span>Achieved</span></div></div>
  </div>
  <div class="grid3 mt">
    <div class="card"><h3>Call outcomes</h3><div class="donut" style="background:conic-gradient(${cg})"><b>${tot}</b></div>
      <div class="lg">${Object.keys(O).map((k,i)=>`<span><i style="background:${cols[i]}"></i>${k} ${O[k]}</span>`).join('')}</div></div>
    <div class="card"><h3>Sales pipeline <small>campaign, this week</small></h3><div class="funnel">
      <div style="width:100%;background:var(--teal)">Eligible · 1,240</div><div style="width:78%;background:var(--blue)">Contacted · 612</div><div style="width:52%;background:var(--yellow);color:#1b1f29">Interested · 148</div><div style="width:30%;background:var(--pink)">Applied · ${61+S.k.sales}</div><div style="width:18%;background:#137a8f">Activated · 22</div></div></div>
    <div class="card"><h3>Team leaderboard <small>interested + applications</small></h3>${T.map((t,i)=>`<div class="lb ${t[2]?'me':''}"><span>${i+1}</span><span>${t[0]}${t[2]?' (you)':''}</span><span>${t[1]}</span><span>${i<3?'🏆':''}</span></div>`).join('')}</div>
  </div>
  <div class="card mt chart"><h3>Agent trend <small>last 10 working days · interested + applications</small></h3>
    <svg viewBox="0 0 580 190" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Agent trend">${[0,4,8].map(v=>`<line x1="40" x2="560" y1="${170-v*14}" y2="${170-v*14}" stroke="var(--line)"/><text class="axis" x="32" y="${173-v*14}" text-anchor="end">${v}</text>`).join('')}
    <path d="${path} L${pts[pts.length-1][0]} 170 L40 170Z" fill="var(--teal-s)"/><path d="${path}" fill="none" stroke="var(--teal)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--teal)"/><text class="axis" x="${p[0]}" y="186" text-anchor="middle">${i===9?'Today':days[i]}</text>`).join('')}</svg></div>`;
}

/* ============ FOLLOW-UPS ============ */
function renderFU(){
  const base=[{c:{name:'Hiba Saadeh',cif:'00451190'},date:'2026-11-05',time:'17:00',mode:'WhatsApp',next:'Call back to complete application',out:'Interested'},
              {c:{name:'Yousef Abbadi',cif:'00398772'},date:'2026-11-08',time:'12:00',mode:'Call',next:'Collect salary certificate',out:'Call back'}];
  const all=[...base,...S.fu].sort((a,b)=>a.date.localeCompare(b.date));
  $('v-fu').innerHTML=`<div class="card"><h3>My follow-ups <small>auto-scheduled to the customer’s best time, Sun–Thu only</small></h3>
  <div class="tw"><table><thead><tr><th>Date</th><th>Time</th><th>Customer</th><th>CIF</th><th>Outcome</th><th>Next step</th><th>Channel</th></tr></thead>
  <tbody>${all.map(f=>`<tr><td>${dmy(f.date)}</td><td>${f.time}</td><td>${f.c.name}</td><td>${f.c.cif}</td><td><span class="tag ${f.out==='Interested'?'t-pink':'t-yel'}">${f.out}</span></td><td>${esc(f.next)}</td><td>${f.mode}</td></tr>`).join('')}</tbody></table></div></div>`;
  kpis();
}
function renderCard(){
  $('v-card').innerHTML=`<div class="grid2"><div class="card"><h3>${CARD.name} <small>launch offer</small></h3>
    <div class="ben" style="grid-template-columns:1fr">${CARD.cb.map(b=>`<div><b>${b[0]}</b>${b[1]}</div>`).join('')}</div>
    <p style="font-size:12.5px"><b>Fees:</b> ${CARD.fee}</p><p style="font-size:12.5px;margin-top:6px"><b>Features:</b> ${CARD.extras}</p><p style="font-size:12.5px;margin-top:6px"><b>Documents:</b> ${CARD.docs}</p></div>
    <div class="card"><h3>Eligibility for this campaign</h3><ul style="padding-left:16px;font-size:12.5px;line-height:1.9">
    <li>Retail Non-Affluent segment, salary JOD 450–1,000</li><li>Relationship of 2+ years, no arrears in the last 12 months</li><li>Debt burden including the new card within the policy cap</li><li>Not on the do-not-call list; marketing consent on file</li></ul>
    <p class="mut" style="font-size:11.5px;margin-top:8px">Product terms are demo values. Replace with the approved product sheet before go-live.</p></div></div>`;
}

/* ============ TABS + INIT ============ */
function tab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['desk','ovr','fu','card'].forEach(v=>$('v-'+v).hidden=v!==t)}
kpis();renderDesk();renderOvr();renderFU();renderCard();pick('C1');
</script>
