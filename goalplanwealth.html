<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Financial Journey & Goals</title>
<style>
  :root{
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --yellow:#F5C518;
    --yellow-deep:#E0AD00;
    --blue:#2f6fd6;
    --ink:#313742;
    --ink-strong:#1a1a1a;
    --muted:#71778a;
    --eyebrow:#9097a3;
    --line:#e8eaee;
    --track:#edeef2;
    --shadow:0 1px 2px rgba(20,25,40,.04);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:transparent;color:var(--ink);
    font-family:var(--font);
    font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:8px;
  }
  .wrap{width:100%;max-width:100%;margin:0;display:flex;flex-direction:column;gap:18px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;}

  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .eyebrow{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--eyebrow);margin:0 0 4px;}
  .sub{font-size:12.5px;color:var(--muted);margin:0;}
  .create-btn{
    flex:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:none;
    background:var(--yellow);color:var(--ink-strong);font-family:var(--font);
    font-weight:700;font-size:13px;padding:10px 16px;border-radius:22px;transition:background .15s;
  }
  .create-btn:hover{background:var(--yellow-deep);}
  .create-btn svg{display:block;}

  /* stages */
  .stages{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .stage{
    position:relative;border:1px solid var(--line);border-radius:12px;background:#fcfcfd;
    padding:20px 12px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;
  }
  .stage:hover{border-color:var(--yellow);background:#fff;}
  .stage .num{
    width:34px;height:34px;border-radius:50%;background:#edeef1;color:#a9adb6;
    font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;
  }
  .stage .sname{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#a9adb6;margin:0 0 4px;}
  .stage .sdesc{font-size:11px;color:#b3b7bf;margin:0;line-height:1.35;}
  .stage.done .num{background:#e7f6ec;color:var(--blue);}
  .stage.done .sname{color:var(--ink);}
  .stage.done .sdesc{color:var(--muted);}
  .stage.active{border:2px solid var(--yellow);background:linear-gradient(180deg,#FFFBEB,#fff);box-shadow:0 6px 18px rgba(245,197,24,.18);}
  .stage.active .num{background:var(--yellow);color:var(--ink-strong);}
  .stage.active .sname{color:var(--ink-strong);}
  .stage.active .sdesc{color:var(--ink);}
  .stage-badge{
    position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    background:var(--yellow);color:var(--ink-strong);font-size:9px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;padding:3px 10px;border-radius:6px;white-space:nowrap;display:none;
  }
  .stage.active .stage-badge{display:block;}

  /* goals */
  .goals-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .goals-head .eyebrow{margin:0;font-size:12px;}
  .goal{border-bottom:1px solid var(--line);padding:16px 0;}
  .goal:last-child{border-bottom:none;padding-bottom:2px;}
  .goal-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;}
  .goal-title{font-size:14px;font-weight:600;color:var(--blue);margin:0;}
  .goal-stage{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-deep);background:#FFF4CC;padding:3px 8px;border-radius:5px;margin-left:8px;vertical-align:middle;}
  .goal-edit{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink-strong);font-family:var(--font);font-weight:600;font-size:12px;padding:6px 14px;border-radius:18px;cursor:pointer;transition:border-color .15s,background .15s;}
  .goal-edit:hover{border-color:var(--ink-strong);background:#fafafa;}
  .goal-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:14px;align-items:center;}
  .gcell .glabel{font-size:10.5px;color:var(--muted);margin:0 0 2px;}
  .gcell .gval{font-size:13.5px;font-weight:700;color:var(--ink-strong);margin:0;}
  .gprog{min-width:120px;}
  .bar{height:8px;background:var(--track);border-radius:20px;overflow:hidden;}
  .bar .fill{height:100%;background:var(--yellow);border-radius:20px;transition:width .4s;}
  .gpct{font-size:11px;color:var(--muted);text-align:right;margin:5px 0 0;font-weight:600;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,22,30,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:460px;padding:24px 26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.3);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;}
  .modal-head h3{font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-strong);margin:0;}
  .modal-head .close{font-size:13px;color:var(--blue);cursor:pointer;font-weight:500;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-strong);margin-bottom:6px;}
  .field input{
    width:100%;font-family:var(--font);font-size:13.5px;color:var(--ink-strong);
    padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fcfcfd;
  }
  .field input:focus{outline:none;border-color:var(--yellow);background:#fff;}
  .field input::placeholder{color:#b3b7bf;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .map-note{font-size:11.5px;color:var(--muted);margin:0 0 16px;}
  .map-note b{color:var(--yellow-deep);}
  .err{color:#d23e3e;font-size:11.5px;margin:-8px 0 12px;display:none;}
  .modal-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:6px;}
  .btn-del{margin-right:auto;background:none;border:none;color:#d23e3e;font-family:var(--font);font-weight:600;font-size:12.5px;cursor:pointer;display:none;}
  .btn-cancel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 20px;font-family:var(--font);font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);}
  .btn-cancel:hover{background:#f6f6f7;}
  .btn-save{background:var(--yellow);border:none;border-radius:20px;padding:10px 22px;font-family:var(--font);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-strong);}
  .btn-save:hover{background:var(--yellow-deep);}

  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink-strong);color:#fff;font-size:13px;font-weight:500;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;}
  #toast b{color:var(--yellow);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:820px){.stages{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:620px){
    .stages{grid-template-columns:repeat(2,1fr);}
    .goal-grid{grid-template-columns:1fr 1fr;}
    .gprog{grid-column:1 / -1;min-width:0;}
  }
  @media (max-width:400px){.row2{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <div class="wrap">

    <div class="card">
      <div class="head">
        <div>
          <h3 class="eyebrow">Interactive Financial Journey Stage &amp; Goals</h3>
          <p class="sub">Click on any financial stage to mark progress, automatically update risk models, and map goals.</p>
        </div>
        <button class="create-btn" id="createBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          Create Custom Financial Goal
        </button>
      </div>
      <div class="stages" id="stages"></div>
    </div>

    <div class="card">
      <div class="goals-head"><h3 class="eyebrow">Goal Plan</h3></div>
      <div id="goals"></div>
    </div>

  </div>

  <!-- modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Map Custom Goal Target</h3>
        <span class="close" id="closeModal">Close</span>
      </div>
      <div class="field">
        <label>Goal Metric Target Title</label>
        <input id="fTitle" type="text" placeholder="e.g. Real Estate Downpayment fund" />
      </div>
      <div class="field">
        <label>Target Amount Value</label>
        <input id="fAmount" type="text" placeholder="e.g. RM 1.5M" />
      </div>
      <div class="row2">
        <div class="field">
          <label>Target Maturity</label>
          <input id="fMaturity" type="text" placeholder="e.g. June 2028" />
        </div>
        <div class="field">
          <label>Initial funding %</label>
          <input id="fFunding" type="number" min="0" max="100" value="10" />
        </div>
      </div>
      <p class="err" id="formErr">Please enter a goal title and a valid target amount.</p>
      <p class="map-note">Will be mapped to: <b id="mapStage">PROTECTION</b> stage</p>
      <div class="modal-actions">
        <button class="btn-del" id="deleteBtn">Delete goal</button>
        <button class="btn-cancel" id="cancelBtn">Cancel</button>
        <button class="btn-save" id="saveBtn">Save &amp; Propagate</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
(function(){
  "use strict";

  // ---- state (in-memory; replace with your CRM goals API) ----
  var stages = [
    {n:"01", name:"Accumulation", desc:"Growth & Capital Inception"},
    {n:"02", name:"Protection",   desc:"Insurance & Tax Shielding"},
    {n:"03", name:"Education",     desc:"Offshore Funding Strategy"},
    {n:"04", name:"Retirement",    desc:"Sustained Annuity Inflows"},
    {n:"05", name:"Legacy",        desc:"Intergenerational Estates"}
  ];
  var activeStage = 1; // Protection

  var goals = [
    {id:1, title:"Children's Overseas Education Fund", amount:2500000, maturity:"Sept 2028", funding:75, stage:"Education"},
    {id:2, title:"Retirement Wealth Accumulation",     amount:5000000, maturity:"Sept 2030", funding:40, stage:"Retirement"},
    {id:3, title:"Buy Secondary Investment Property",  amount:2500000, maturity:"Sept 2028", funding:48, stage:"Accumulation"},
    {id:4, title:"Legacy & Estate Planning Fund",      amount:5000000, maturity:"Sept 2035", funding:35, stage:"Legacy"}
  ];
  var nextId = 5;
  var editingId = null;

  // ---- helpers ----
  function fmtRM(n){ return "RM " + Math.round(n).toLocaleString("en-MY"); }
  function parseAmount(s){
    if(!s) return null;
    s = String(s).toUpperCase().replace(/[^0-9.MK]/g,"");
    var mult = 1;
    if(s.slice(-1)==="M"){mult=1e6; s=s.slice(0,-1);}
    else if(s.slice(-1)==="K"){mult=1e3; s=s.slice(0,-1);}
    var num = parseFloat(s);
    if(isNaN(num) || num<=0) return null;
    return Math.round(num*mult);
  }
  function clampPct(v){ v=parseInt(v,10); if(isNaN(v))v=0; return Math.max(0,Math.min(100,v)); }

  // ---- render stages ----
  var stagesEl = document.getElementById("stages");
  function renderStages(){
    stagesEl.innerHTML = stages.map(function(s,i){
      var cls = "stage" + (i===activeStage?" active":(i<activeStage?" done":""));
      return '<div class="'+cls+'" data-i="'+i+'">'
        + '<span class="stage-badge">Active Stage</span>'
        + '<div class="num">'+s.n+'</div>'
        + '<p class="sname">'+s.name+'</p>'
        + '<p class="sdesc">'+s.desc+'</p>'
        + '</div>';
    }).join("");
  }
  stagesEl.addEventListener("click", function(e){
    var el = e.target.closest(".stage");
    if(!el) return;
    activeStage = parseInt(el.dataset.i,10);
    renderStages();
    document.getElementById("mapStage").textContent = stages[activeStage].name.toUpperCase();
    toast("Risk model recalibrated &mdash; <b>"+stages[activeStage].name+"</b> stage active");
  });

  // ---- render goals ----
  var goalsEl = document.getElementById("goals");
  function renderGoals(){
    if(!goals.length){ goalsEl.innerHTML = '<p class="sub" style="padding:8px 0">No goals yet. Use “Create Custom Financial Goal” to add one.</p>'; return; }
    goalsEl.innerHTML = goals.map(function(g){
      var actual = g.amount * g.funding / 100;
      return '<div class="goal">'
        + '<div class="goal-top">'
          + '<h4 class="goal-title">'+g.title+'<span class="goal-stage">'+g.stage+'</span></h4>'
          + '<button class="goal-edit" data-id="'+g.id+'">Edit / Update</button>'
        + '</div>'
        + '<div class="goal-grid">'
          + '<div class="gcell"><p class="glabel">Target Value</p><p class="gval">'+fmtRM(g.amount)+'</p></div>'
          + '<div class="gcell"><p class="glabel">Actual Value</p><p class="gval">'+fmtRM(actual)+'</p></div>'
          + '<div class="gcell"><p class="glabel">Target Maturity</p><p class="gval">'+g.maturity+'</p></div>'
          + '<div class="gcell gprog"><div class="bar"><div class="fill" style="width:'+g.funding+'%"></div></div><p class="gpct">'+g.funding+'%</p></div>'
        + '</div>'
      + '</div>';
    }).join("");
  }
  goalsEl.addEventListener("click", function(e){
    var btn = e.target.closest(".goal-edit");
    if(!btn) return;
    openModal(parseInt(btn.dataset.id,10));
  });

  // ---- modal ----
  var overlay = document.getElementById("overlay");
  var fTitle=document.getElementById("fTitle"), fAmount=document.getElementById("fAmount"),
      fMaturity=document.getElementById("fMaturity"), fFunding=document.getElementById("fFunding"),
      formErr=document.getElementById("formErr"), modalTitle=document.getElementById("modalTitle"),
      deleteBtn=document.getElementById("deleteBtn"), mapStage=document.getElementById("mapStage");

  function openModal(id){
    editingId = id || null;
    formErr.style.display = "none";
    mapStage.textContent = stages[activeStage].name.toUpperCase();
    if(editingId){
      var g = goals.find(function(x){return x.id===editingId;});
      modalTitle.textContent = "Update Goal Target";
      fTitle.value=g.title; fAmount.value=fmtRM(g.amount); fMaturity.value=g.maturity; fFunding.value=g.funding;
      mapStage.textContent = g.stage.toUpperCase();
      deleteBtn.style.display="inline";
    } else {
      modalTitle.textContent = "Map Custom Goal Target";
      fTitle.value=""; fAmount.value=""; fMaturity.value=""; fFunding.value=10;
      deleteBtn.style.display="none";
    }
    overlay.classList.add("show");
    fTitle.focus();
  }
  function closeModal(){ overlay.classList.remove("show"); }

  document.getElementById("createBtn").addEventListener("click", function(){ openModal(null); });
  document.getElementById("closeModal").addEventListener("click", closeModal);
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeModal(); });

  document.getElementById("saveBtn").addEventListener("click", function(){
    var title = fTitle.value.trim();
    var amount = parseAmount(fAmount.value);
    if(!title || !amount){ formErr.style.display="block"; return; }
    var maturity = fMaturity.value.trim() || "TBD";
    var funding = clampPct(fFunding.value);

    if(editingId){
      var g = goals.find(function(x){return x.id===editingId;});
      g.title=title; g.amount=amount; g.maturity=maturity; g.funding=funding;
      toast("Goal updated &amp; propagated &mdash; <b>"+title+"</b>");
    } else {
      goals.push({id:nextId++, title:title, amount:amount, maturity:maturity, funding:funding, stage:stages[activeStage].name});
      toast("Goal saved &amp; propagated &mdash; <b>"+title+"</b>");
    }
    // TODO: POST/PUT to your CRM goals API here, then re-render from the response.
    renderGoals();
    closeModal();
  });

  deleteBtn.addEventListener("click", function(){
    goals = goals.filter(function(x){return x.id!==editingId;});
    toast("Goal removed");
    renderGoals();
    closeModal();
  });

  // ---- toast ----
  var toastEl = document.getElementById("toast"), toastT;
  function toast(msg){
    toastEl.innerHTML = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove("show");},2200);
  }

  // ---- init ----
  renderStages();
  renderGoals();
})();
</script>
</body>
</html>
