<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mortgage Loan Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ground:#FFFFFF; --surface:#FFFFFF; --surface-2:#F8F8F8; --line:#E3E3E3; --line-2:#EFEFEF;
  --ink:#000000; --muted:#595959; --accent:#E91E8C; --accent-text:#C2166F; --accent-ink:#FFFFFF; --accent-soft:#FCE4F1; --accent-soft-ink:#A3105F;
  --gold:#F2B705; --gold-soft:#FDF3D6; --gold-ink:#8A6100;
  --teal:#17B7C4; --teal-soft:#E1F7F9; --teal-ink:#0E6F78;
  --blue:#2A6FE0; --blue-soft:#E6EFFD; --blue-ink:#1C4FA8;
  --warn-soft:#FDF3D6; --warn-ink:#8A6100; --bad-soft:#1A1A1A; --bad-ink:#FFFFFF;
  --grey-soft:#EDEDED; --grey-ink:#595959; --track:#F1F1F1;
  --sans:"Poppins",Calibri,"Segoe UI",system-ui,sans-serif; --serif:var(--sans); --mono:var(--sans);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--muted);font-family:var(--sans);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:28px clamp(16px,3vw,40px) 64px}
.crumb{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 6px;display:flex;gap:10px;align-items:center}
.sample{font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--track);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{min-height:48px;padding:0 18px;border:0;background:none;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-text);font-weight:600;border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);font-size:13px;margin-left:6px}
[hidden]{display:none!important}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:0 1px 3px rgba(15,17,23,.05)}
.panel h2{font-size:17px;font-weight:600;margin:0;color:var(--ink)}
.panel h3{font-size:14px;font-weight:600;margin:0 0 14px;color:var(--ink)}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:16px}
.hint{font-size:13px;color:var(--muted)}
.filters{margin-bottom:16px;padding:0}
.f-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px 10px 10px}
.f-toggle{color:var(--ink);display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:none;font-weight:600;font-size:15px;cursor:pointer}
.f-toggle:hover{background:var(--surface-2)}
.f-toggle svg{transition:transform .2s ease}
.f-toggle[aria-expanded="false"] svg{transform:rotate(-90deg)}
.f-count{font-family:var(--mono);font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-soft-ink)}
.f-summary{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 240px}
.f-chip{font-size:13px;padding:4px 10px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.f-head .btn{margin-left:auto}
.f-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;padding:4px 22px 22px;border-top:1px solid var(--line-2);padding-top:18px}
@media (max-width:640px){.f-body{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-weight:400;font-size:14px;color:var(--ink)}
.field select.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--line);box-shadow:0 1px 3px rgba(15,17,23,.05)}
.kpi.a-blue{border-top-color:var(--blue)}
.kpi.a-pink{border-top-color:var(--accent)}
.kpi.a-teal{border-top-color:var(--teal)}
.kpi.a-gold{border-top-color:var(--gold)}
.kpi .l{font-size:14px;color:var(--muted);font-weight:500}
.kpi .v{font-size:30px;font-weight:700;line-height:1.15;color:var(--ink)}
.kpi .s{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.srow{display:grid;grid-template-columns:150px 1fr 170px;gap:14px;align-items:center;margin-bottom:12px;font-size:14px}
.srow .track{height:28px;border-radius:6px;background:var(--surface-2)}
.srow .fill{height:28px;border-radius:6px}
.srow .r{font-family:var(--mono);text-align:right;font-size:13px}
.srow .r span{color:var(--muted)}
@media (max-width:600px){.srow{grid-template-columns:100px 1fr 110px}}
.hbar{margin-bottom:12px}
.hbar-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}
.hbar-top .r{font-family:var(--mono);white-space:nowrap}
.hbar-top .c{color:var(--muted)}
.hbar .t{height:8px;border-radius:4px;background:var(--track)}
.hbar .f{height:8px;border-radius:4px;background:var(--accent);transition:width .3s ease}
.section-title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin:32px 0 16px;padding-top:20px;border-top:1px solid var(--line)}
.section-title h2{font-size:22px;font-weight:600;margin:0;color:var(--ink);letter-spacing:.02em}
.demo{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(15,17,23,.05)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:#FFFFFF;background:#1A1A1A;padding:13px 12px;white-space:nowrap}
td{padding:12px;border-top:1px solid var(--line-2);white-space:nowrap}
.num{font-family:var(--mono)}
td.r,th.r{text-align:right}
.tag{font-size:12px;font-weight:600;padding:4px 8px;border-radius:4px;white-space:nowrap}
.tbl-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.search{margin-bottom:12px;max-width:460px}
.list-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.list-head h2{font-size:22px;font-weight:600;margin:0;color:var(--ink)}
.pager{display:flex;align-items:center;gap:8px}
.pager .btn{min-height:40px;padding:0 14px}
.pager .btn:disabled{opacity:.45;cursor:default}
td .sub{display:block;font-size:12px;color:var(--muted)}
td.name{font-weight:500;color:var(--ink)}
tbody tr:hover td{background:#FDF3F9}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.tabs,.actions,.btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <p id="asof" hidden></p>

  <section class="panel filters" aria-label="Report filters">
    <div class="f-head">
      <button type="button" class="f-toggle" id="fToggle" aria-expanded="true" aria-controls="fBody">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        Filters <span class="f-count" id="fCount" hidden></span>
      </button>
      <div class="f-summary" id="fSummary" hidden></div>
      <button class="btn" type="button" id="clear">Clear filters</button>
    </div>
    <div class="f-body" id="fBody">
      <label class="field">Period<select id="fPeriod">
        <option value="ytd">Year to date</option><option value="90">Last 90 days</option><option value="30">Last 30 days</option><option value="7">Last 7 days</option></select></label>
      <label class="field">Channel<select id="fChannel"></select></label>
      <label class="field">Developer name<select id="fDev"></select></label>
      <label class="field">Project name<select id="fProj"></select></label>
      <label class="field">Program name<select id="fProg"></select></label>
      <label class="field">Region<select id="fRegion"></select></label>
    </div>
  </section>

  <div class="tabs" role="tablist" aria-label="Report views">
    <button class="tab" role="tab" id="t-dash" aria-controls="p-dash" aria-selected="true">Dashboard</button>
    <button class="tab" role="tab" id="t-list" aria-controls="p-list" aria-selected="false">Application detail<span class="n" id="tabN"></span></button>
  </div>

  <section id="p-dash" role="tabpanel" aria-labelledby="t-dash">
    <div class="kpis" id="kpis"></div>
    <div class="two">
      <div class="panel">
        <div class="panel-head"><h2>Pipeline by status</h2><span class="hint">Accounts and loan amount</span></div>
        <div id="status"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Accounts by program</h2><span class="hint">Share of accounts</span></div>
        <div id="programs"></div>
      </div>
    </div>
    <div class="section-title"><h2>Borrower demographics</h2><span class="hint" id="demoBase"></span></div>
    <div class="demo" id="demo"></div>
  </section>

  <section id="p-list" role="tabpanel" aria-labelledby="t-list" hidden>
    <div class="list-head">
      <div><h2>Application detail report</h2><p class="hint" style="margin:4px 0 0" id="listSub"></p></div>
      <label class="field search" style="margin:0;flex:0 1 420px">Search<input type="search" id="q" placeholder="Borrower name, account number, project, branch"></label>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Account no.</th><th>Borrower name</th><th>Turn-in date</th><th>Developer</th><th>Project</th><th>Program</th><th>Channel</th><th>Region / branch</th><th class="r">Loan amount</th><th class="r">Tenor</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="tbl-foot">
        <span id="foot"></span>
        <div class="pager">
          <label class="field" style="flex-direction:row;align-items:center;gap:8px;font-weight:500">Rows<select id="pageSize"><option>25</option><option>50</option><option>100</option></select></label>
          <button class="btn" type="button" id="prev">Previous</button>
          <span id="pageInfo" class="num" style="font-size:13px"></span>
          <button class="btn" type="button" id="next">Next</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const peso=n=>n>=1e9?'₱'+(n/1e9).toFixed(2)+'B':n>=1e6?'₱'+(n/1e6).toFixed(2)+'M':'₱'+fmt(n);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=new Date(2026,8,23);
$('#asof').textContent='All mortgage loan applications, as of 23 Sep 2026';

/* tabs */
const tabs=[['t-dash','p-dash'],['t-list','p-list']];
tabs.forEach(([t])=>$('#'+t).addEventListener('click',()=>tabs.forEach(([a,p])=>{$('#'+a).setAttribute('aria-selected',a===t);$('#'+p).hidden=a!==t;})));

/* ---------- reference data ---------- */
const NO_DEV='No developer (resale / construction)';
const DEVELOPERS={
  'AYALA LAND, INC':[
    {name:'TWO SERENDRA (THE ASTON TOWER)',type:'Condominium',min:4.5e6,max:12e6},
    {name:'Alpha Heights Phase 2',type:'House and lot',min:2.5e6,max:7.5e6},
    {name:'Alpha Garden Villas',type:'Townhouse',min:2e6,max:5.5e6}],
  'Bayside Homes Corp.':[
    {name:'Bayside Marina Towers',type:'Condominium',min:3e6,max:8e6},
    {name:'Bayside Palm Residences',type:'House and lot',min:2e6,max:6e6}],
  'Metro Vista Properties':[
    {name:'Metro Vista Central',type:'Condominium',min:2.5e6,max:6.5e6},
    {name:'Metro Vista Park',type:'House and lot',min:1.8e6,max:5e6}]
};
const DEV_W={'AYALA LAND, INC':.3,'Bayside Homes Corp.':.22,'Metro Vista Properties':.22,[NO_DEV]:.26};
const REGION_W={NCR:.44,'Luzon (ex-NCR)':.29,Visayas:.16,Mindanao:.11};
const REGION_LABEL={'NCR':'Metro Manila','Luzon (ex-NCR)':'Rest of Luzon','Visayas':'Visayas','Mindanao':'Mindanao'};
const rl=r=>REGION_LABEL[r]||r;
const BRANCHES={NCR:['Makati Ayala','Quezon Ave','BGC 5th Ave','Ortigas Center'],'Luzon (ex-NCR)':['Alabang','Clark','Batangas'],Visayas:['Cebu IT Park','Iloilo'],Mindanao:['Davao Lanang','Cagayan de Oro']};
const CHANNELS=['Branch','Developer / broker','Online','Telesales'];
const PROGRAMS=['Developer Turn-in Promo','OFW Home Promo','Rate Lock Test Program','No program (regular)'];
const STATUS=[
  ['Received / in evaluation','In evaluation','#FDF3D6','#8A6100','#F2B705'],
  ['Approved, not yet booked','Approved','#E6EFFD','#1C4FA8','#2A6FE0'],
  ['Booked / released','Booked','#E91E8C','#FFFFFF','#E91E8C'],
  ['Declined','Declined','#1A1A1A','#FFFFFF','#1A1A1A'],
  ['Withdrawn / cancelled','Withdrawn','#EDEDED','#595959','#BDBDBD']];
const FIRST=['Maria','Jose','Juan','Ana','Mark','Kristine','John Paul','Angelica','Carlo','Patricia','Miguel','Camille','Rafael','Jasmine','Paolo','Andrea','Joshua','Nicole','Christian','Bea','Renato','Lorna','Ramon','Teresa','Antonio','Grace','Francis','Rowena','Emmanuel','Liza','Gabriel','Katrina','Vincent','Shiela','Dennis','Maricel','Allan','Joy','Arnel','Cherry'];
const LAST=['Santos','Reyes','Cruz','Bautista','Ocampo','Garcia','Mendoza','Torres','Tomas','Andrada','Castillo','Flores','Villanueva','Ramos','Castro','Rivera','Aquino','Navarro','Salazar','Mercado','Dela Cruz','Gonzales','Lopez','Hernandez','Perez','Del Rosario','Aguilar','Pascual','Soriano','Manalo','Dizon','Lim','Tan','Sy','Valdez','Domingo','Fernandez','Marquez','Robles','Evangelista'];

/* ---------- generate the full application book (sample, seeded) ---------- */
let seed=20260923;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const pickW=w=>{const r=rnd();let a=0;for(const k in w){a+=w[k];if(r<a)return k;}return Object.keys(w).pop();};
const pickA=a=>a[Math.floor(rnd()*a.length)];
const N=4860, APPS=[];
for(let i=0;i<N;i++){
  const dev=pickW(DEV_W);
  let proj=null,ptype,amt,purpose;
  if(dev!==NO_DEV){proj=pickA(DEVELOPERS[dev]);ptype=proj.type;amt=proj.min+(proj.max-proj.min)*rnd()*rnd()*1.3;purpose='Purchase from developer';}
  else{ptype=pickW({'House and lot':.55,'Condominium':.2,'Lot only / construction':.25});purpose=ptype==='Lot only / construction'?'Construction':pickW({'Resale purchase':.6,'Refinancing':.4});amt=6e5+rnd()*rnd()*5e6;}
  amt=Math.min(Math.round(amt/10000)*10000, 15e6);
  const channel=dev!==NO_DEV?pickW({'Developer / broker':.45,'Branch':.33,'Online':.15,'Telesales':.07}):pickW({'Branch':.6,'Online':.28,'Telesales':.12});
  const employment=pickW({'Locally employed':.51,'Self-employed':.22,'OFW':.19,'Professional':.08});
  let program;
  if(employment==='OFW'&&rnd()<.55)program='OFW Home Promo';
  else if(dev!==NO_DEV&&rnd()<.42)program='Developer Turn-in Promo';
  else if(rnd()<.08)program='Rate Lock Test Program';
  else program='No program (regular)';
  const daysAgo=Math.floor(Math.pow(rnd(),.9)*266);
  const d=new Date(TODAY);d.setDate(d.getDate()-daysAgo);
  const sw=daysAgo<21?{0:.7,1:.15,2:.05,3:.07,4:.03}:daysAgo<60?{0:.3,1:.22,2:.33,3:.1,4:.05}:{0:.06,1:.08,2:.68,3:.12,4:.06};
  const st=+pickW(sw);
  const region=pickW(REGION_W);
  const age=pickW({'21–30':.17,'31–40':.39,'41–50':.28,'51–60':.12,'Over 60':.04});
  APPS.push({
    acct:'HL-2026-'+String(100001+i).slice(1),
    name:`${pickA(FIRST)} ${String.fromCharCode(65+Math.floor(rnd()*26))}. ${pickA(LAST)}`,
    d,daysAgo,dev,proj:proj?proj.name:'—',program,channel,region,branch:pickA(BRANCHES[region]),amt,
    tenor:+pickW({5:.07,10:.19,15:.3,20:.34,25:.1}),st,
    age,gender:pickW({Male:.57,Female:.43}),civil:pickW({Married:.62,Single:.31,'Widowed / separated':.07}),
    income:pickW({'Below ₱50K':.14,'₱50K–100K':.37,'₱100K–200K':.32,'Above ₱200K':.17}),employment,ptype,purpose
  });
}
APPS.sort((a,b)=>b.d-a.d||a.acct.localeCompare(b.acct));

/* ---------- filters ---------- */
const PERIOD_DAYS={ytd:9999,'90':90,'30':30,'7':7};
const opt=(v,t)=>`<option value="${esc(v)}">${esc(t||v)}</option>`;
$('#fChannel').innerHTML=opt('all','All')+CHANNELS.map(c=>opt(c)).join('');
$('#fDev').innerHTML=opt('all','All')+Object.keys(DEVELOPERS).map(d=>opt(d)).join('')+opt(NO_DEV);
$('#fProg').innerHTML=opt('all','All')+PROGRAMS.map(c=>opt(c)).join('');
$('#fRegion').innerHTML=opt('all','All')+Object.keys(REGION_W).map(c=>opt(c,rl(c))).join('');
function fillProjects(){
  const dev=$('#fDev').value, keep=$('#fProj').value;
  let h=opt('all','All');
  if(dev==='all')h+=Object.entries(DEVELOPERS).map(([d,ps])=>`<optgroup label="${esc(d)}">${ps.map(p=>opt(p.name)).join('')}</optgroup>`).join('');
  else if(dev!==NO_DEV)h+=DEVELOPERS[dev].map(p=>opt(p.name)).join('');
  $('#fProj').innerHTML=h;
  $('#fProj').disabled=dev===NO_DEV;
  $('#fProj').value=[...$('#fProj').options].some(o=>o.value===keep)?keep:'all';
}
fillProjects();

const FIELDS={period:'#fPeriod',channel:'#fChannel',dev:'#fDev',proj:'#fProj',program:'#fProg',region:'#fRegion'};
function current(){
  const f={};for(const k in FIELDS){f[k]=$(FIELDS[k]).value;}
  for(const k in FIELDS)$(FIELDS[k]).classList.toggle('on',k==='period'?f[k]!=='ytd':f[k]!=='all');
  const active=[];
  if(f.period!=='ytd')active.push($('#fPeriod').selectedOptions[0].text);
  ['channel','dev','proj','program','region'].forEach(k=>{if(f[k]!=='all')active.push(f[k]);});
  $('#fCount').hidden=!active.length;$('#fCount').textContent=active.length+' active';
  const collapsed=$('#fToggle').getAttribute('aria-expanded')==='false';
  $('#fSummary').hidden=!collapsed;
  $('#fSummary').innerHTML=active.length?active.map(a=>`<span class="f-chip">${esc(a)}</span>`).join(''):'<span class="hint">Year to date, all applications</span>';
  return f;
}
function filtered(f){
  const pd=PERIOD_DAYS[f.period];
  return APPS.filter(a=>a.daysAgo<pd&&(f.channel==='all'||a.channel===f.channel)&&(f.dev==='all'||a.dev===f.dev)&&(f.proj==='all'||a.proj===f.proj)&&(f.program==='all'||a.program===f.program)&&(f.region==='all'||a.region===f.region));
}

/* ---------- dashboard ---------- */
function hbar(label,count,total){
  const pct=total?count/total*100:0;
  return `<div class="hbar"><div class="hbar-top"><span>${esc(label)}</span><span class="r">${pct.toFixed(0)}% <span class="c">(${fmt(count)})</span></span></div><div class="t"><div class="f" style="width:${pct}%"></div></div></div>`;
}
function hbarPct(label,count,total){
  const pct=total?count/total*100:0;
  return `<div class="hbar"><div class="hbar-top"><span>${esc(label)}</span><span class="r">${pct.toFixed(0)}%</span></div><div class="t"><div class="f" style="width:${pct}%"></div></div></div>`;
}
const bandOf=a=>a.amt<1e6?'Below ₱1M':a.amt<3e6?'₱1M–3M':a.amt<5e6?'₱3M–5M':'Above ₱5M';
const PANELS=[
  ['Age band',a=>a.age,['21–30','31–40','41–50','51–60','Over 60']],
  ['Gender',a=>a.gender,['Male','Female']],
  ['Civil status',a=>a.civil,['Married','Single','Widowed / separated']],
  ['Gross monthly income',a=>a.income,['Below ₱50K','₱50K–100K','₱100K–200K','Above ₱200K']],
  ['Employment type',a=>a.employment,['Locally employed','Self-employed','OFW','Professional']],
  ['Region',a=>a.region,Object.keys(REGION_W)],
  ['Channel',a=>a.channel,CHANNELS],
  ['Developer name',a=>a.dev,[...Object.keys(DEVELOPERS),NO_DEV]],
  ['Loan amount band',bandOf,['Below ₱1M','₱1M–3M','₱3M–5M','Above ₱5M']],
  ['Loan tenor',a=>a.tenor+' years',['5 years','10 years','15 years','20 years','25 years']],
  ['Property type',a=>a.ptype,['House and lot','Condominium','Townhouse','Lot only / construction']],
  ['Loan purpose',a=>a.purpose,['Purchase from developer','Resale purchase','Construction','Refinancing']]
];
let rows=[];
function renderDash(){
  const f=current(); rows=filtered(f); page=0;
  const n=rows.length, amt=rows.reduce((s,a)=>s+a.amt,0);
  const booked=rows.filter(a=>a.st===2), bookedAmt=booked.reduce((s,a)=>s+a.amt,0);
  $('#kpis').innerHTML=[
    ['Total accounts',fmt(n),n===APPS.length?'All mortgage applications, year to date':`${(n/APPS.length*100).toFixed(1)}% of all ${fmt(APPS.length)} applications`,'a-blue'],
    ['Total loan amount',peso(amt),'Applied-for amount','a-pink'],
    ['Average loan size',n?peso(amt/n):'—','Per application','a-teal'],
    ['Booked / released',fmt(booked.length),peso(bookedAmt)+' released','a-gold']
  ].map(k=>`<div class="kpi ${k[3]}"><span class="l">${k[0]}</span><span class="v">${k[1]}</span><span class="s">${k[2]}</span></div>`).join('');
  $('#tabN').textContent=fmt(n);

  const byS=STATUS.map((s,i)=>{const r=rows.filter(a=>a.st===i);return [r.length,r.reduce((t,a)=>t+a.amt,0)];});
  const maxS=Math.max(1,...byS.map(x=>x[0]));
  $('#status').innerHTML=STATUS.map((s,i)=>`<div class="srow"><span>${s[0]}</span><div class="track"><div class="fill" style="width:${byS[i][0]/maxS*100}%;background:${s[4]}"></div></div><span class="r">${fmt(byS[i][0])} <span>${peso(byS[i][1])}</span></span></div>`).join('');

  const count=(fn,keys)=>{const m=Object.fromEntries(keys.map(k=>[k,0]));rows.forEach(a=>{const k=fn(a);if(k in m)m[k]++;});return m;};
  const pm=count(a=>a.program,PROGRAMS);
  $('#programs').innerHTML=PROGRAMS.map(p=>hbar(p,pm[p],n)).join('');

  $('#demoBase').textContent=`Based on ${fmt(n)} applications, share of accounts (count)`;
  $('#demo').innerHTML=PANELS.map(([t,fn,keys,devOnly])=>{
    const m=count(fn,keys); const base=devOnly?keys.reduce((s,k)=>s+m[k],0):n;
    const note=devOnly?`<p class="hint" style="margin:-8px 0 12px">Share of ${fmt(base)} developer-project applications</p>`:'';
    const rows=t==='Region'?keys.map(k=>hbarPct(rl(k),m[k],base)):keys.map(k=>hbar(k,m[k],base));
    return `<div class="panel"><h3>${t}</h3>${note}${rows.join('')}</div>`;
  }).join('');
  renderList();
}

/* ---------- detail report ---------- */
let page=0;
function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const list=q?rows.filter(a=>(a.name+' '+a.acct+' '+a.proj+' '+a.branch+' '+a.dev).toLowerCase().includes(q)):rows;
  const size=+$('#pageSize').value, pages=Math.max(1,Math.ceil(list.length/size));
  page=Math.min(page,pages-1);
  const slice=list.slice(page*size,page*size+size);
  $('#rows').innerHTML=slice.length?slice.map(a=>`<tr>
    <td class="num">${a.acct}</td>
    <td class="name">${esc(a.name)}</td>
    <td>${a.d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</td>
    <td>${esc(a.dev)}</td>
    <td>${esc(a.proj)}</td>
    <td>${esc(a.program)}</td>
    <td>${esc(a.channel)}</td>
    <td>${esc(rl(a.region))}<span class="sub">${esc(a.branch)}</span></td>
    <td class="r num">₱${fmt(a.amt)}</td>
    <td class="r">${a.tenor} yrs</td>
    <td><span class="tag" style="background:${STATUS[a.st][2]};color:${STATUS[a.st][3]}">${STATUS[a.st][1]}</span></td></tr>`).join('')
    :`<tr><td colspan="11" style="padding:28px 12px;color:var(--muted);white-space:normal">No applications match these filters. Widen the period or clear a filter.</td></tr>`;
  const from=list.length?page*size+1:0;
  $('#foot').textContent=`Showing ${fmt(from)}–${fmt(page*size+slice.length)} of ${fmt(list.length)} applications`;
  $('#pageInfo').textContent=`Page ${page+1} of ${fmt(pages)}`;
  $('#prev').disabled=page===0;$('#next').disabled=page>=pages-1;
  $('#listSub').textContent=`${fmt(list.length)} applications, ${peso(list.reduce((s,a)=>s+a.amt,0))} total loan amount, newest first`;
}
$('#prev').addEventListener('click',()=>{page--;renderList();});
$('#next').addEventListener('click',()=>{page++;renderList();});
$('#pageSize').addEventListener('change',()=>{page=0;renderList();});
$('#q').addEventListener('input',()=>{page=0;renderList();});

/* ---------- filter panel ---------- */
$('#fToggle').addEventListener('click',()=>{
  const open=$('#fToggle').getAttribute('aria-expanded')==='true';
  $('#fToggle').setAttribute('aria-expanded',!open);$('#fBody').hidden=open;
  try{localStorage.setItem('mlp-filters',open?'closed':'open');}catch(e){}
  current();
});
try{if(localStorage.getItem('mlp-filters')==='closed'){$('#fToggle').setAttribute('aria-expanded','false');$('#fBody').hidden=true;}}catch(e){}
$('#fDev').addEventListener('change',()=>{fillProjects();renderDash();});
['#fPeriod','#fChannel','#fProj','#fProg','#fRegion'].forEach(id=>$(id).addEventListener('change',renderDash));
$('#clear').addEventListener('click',()=>{$('#fPeriod').value='ytd';['#fChannel','#fDev','#fProg','#fRegion'].forEach(id=>$(id).value='all');fillProjects();$('#fProj').value='all';renderDash();});
renderDash();
})();
</script>
</body>
</html>
